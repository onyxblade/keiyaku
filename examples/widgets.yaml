openapi: 3.1.0
info:
  title: Widgets
  version: "1.0"
servers:
  - url: https://api.widgets.test/v1
# Declared for the whole document, which is where most documents put it and
# which nothing else here exercises: the Petstore states a requirement on
# every operation, and the sidecar has none at all.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Widget:
      type: object
      required: [id, created_at]
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        labels: { type: object, additionalProperties: { type: string } }
        retired: { type: boolean }
    Problem:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        trace_id: { type: string }
        # Undiscriminated on purpose: this one has to degrade, with a note.
        source:
          anyOf: [{ type: string }, { type: integer }]
    WidgetCreated:
      type: object
      required: [kind, widget]
      properties:
        kind: { type: string }
        widget: { $ref: "#/components/schemas/Widget" }
    WidgetRetired:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: integer }
        reason: { type: string }
    ImportQueued:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }
    Note:
      type: object
      required: [text]
      properties:
        text: { type: string }
        locale: { type: string }
    Event:
      oneOf:
        - $ref: "#/components/schemas/WidgetCreated"
        - $ref: "#/components/schemas/WidgetRetired"
      discriminator:
        propertyName: kind
        mapping:
          created: "#/components/schemas/WidgetCreated"
          retired: "#/components/schemas/WidgetRetired"
paths:
  /widgets:
    get:
      operationId: listWidgets
      parameters:
        # `deepObject` on an array, which is what Stripe writes on `expand`.
        # The style's one row in the specification covers objects and marks
        # array n/a, so there is nothing to generate and this operation is the
        # document's refusal.
        - name: expand
          in: query
          style: deepObject
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Widget" } }
    post:
      operationId: createWidget
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Widget" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "422":
          description: invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
  /widgets/{id}/photo:
    post:
      operationId: uploadPhoto
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                caption: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
  # Three things at once that a document is entitled to say and that Ruby is
  # awkward about: a body that is text rather than JSON, a parameter named
  # after a keyword, and two success statuses that are two different types.
  /widgets/import:
    post:
      operationId: importWidgets
      parameters:
        # `until` is a keyword argument, which Ruby will take; the generated
        # body reads it back out of its binding, since naming it there would
        # start a loop.
        - { name: until, in: query, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        # Two media types for one string. The first is used and the other is
        # reported, since the schemas differ only in the header.
        content:
          text/csv: { schema: { type: string } }
          text/plain: { schema: { type: string } }
      responses:
        "200":
          description: imported
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Widget" } }
        "202":
          description: still importing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportQueued" }
  # Three more things a document says plainly and that a client has to carry
  # rather than round off: a body under the server's own media type, a body it
  # never required, and errors described by range instead of one at a time.
  /widgets/{id}/notes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      # Declared here for every operation under this path, and narrowed by the
      # one below. Same name and same place is one parameter with two things
      # said about it, not two parameters that collide.
      - { name: locale, in: query, schema: { type: string } }
    post:
      operationId: addNote
      parameters:
        - { name: locale, in: query, required: true, schema: { type: string } }
      # No `required: true`, which the specification reads as optional: this
      # endpoint takes an empty note, and a client that cannot send one has
      # nothing to offer but a `nil` that goes out as `null`.
      requestBody:
        content:
          application/vnd.widgets.v2+json:
            schema: { $ref: "#/components/schemas/Note" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "4XX":
          description: anything the caller got wrong
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
  /widgets/search:
    get:
      operationId: searchWidgets
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        # The other side of the same line: `deepObject` on an object is the
        # one thing the style does mean, and the properties give it a type of
        # its own rather than leaving the caller a bare Hash. It rides along
        # with the pagination, since a filter holds across pages.
        - name: filter
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              status: { type: string }
              since: { type: string, format: date-time }
      x-keiyaku-paginate: { by: cursor, param: cursor, next: next_cursor, items: items }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Widget" } }
                  next_cursor: { type: string }
  /widgets/feed:
    get:
      operationId: widgetFeed
      x-keiyaku-paginate: { by: link }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Widget" } }
  /widgets/{id}/events:
    get:
      operationId: listEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      x-keiyaku-paginate: { by: offset, param: offset, size: limit, per: 2 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Event" } }
